<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.S Handmade | إبداعات يدوية</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- شاشة الترحيب -->
    <div id="intro-screen">
        <div class="intro-content">
            <h1>✨ M.S Handmade ✨</h1>
            <p>حيث تتحول المشاعر إلى قطع فنية تنبض بالحياة...</p>
        </div>
    </div>

    <!-- الشريط العلوي -->
    <header class="fade-element">

        <div class="logo">
            M.S <span>Handmade</span>
        </div>

        <nav>
            <a href="#" class="active">الرئيسية</a>
            <a href="#our-work">أعمالنا</a>
            <a href="#about">من نحن</a>
            <a href="#contact">تواصل معنا</a>
        </nav>

    </header>

    <!-- شريط الأدمن -->
    <div id="admin-bar" style="text-align:center;margin:20px;">

        <button id="login-btn" class="btn-primary">
            تسجيل دخول الأدمن
        </button>

        <button id="logout-btn"
                class="btn-secondary"
                style="display:none;">
            تسجيل خروج
        </button>

    </div>

    <!-- القسم الرئيسي -->
    <section class="hero fade-element">

        <div class="logo-container">
            <img src="ms.png"
                 class="brand-logo"
                 alt="Logo">
        </div>

        <div class="hero-badge">
            مصنوع خصيصاً ليناسب ذوقك الرفيع
        </div>

        <h1>إبداعات يدوية مصنوعة بكل إتقان</h1>

        <p>
            كل قطعة تحكي قصة فريدة،
            صُممت وأُحيكت بعناية فائقة.
        </p>

    </section>

    <!-- المنتجات -->
    <section id="our-work"
             class="gallery-section fade-element">

        <div class="section-header">

            <h2>
                ✨ لمعة إبداعاتنا ✨
            </h2>

            <button id="show-add-form"
                    class="btn-secondary"
                    style="display:none;">

                + إضافة منتج جديد

            </button>

        </div>

        <!-- نموذج إضافة المنتج -->
        <div id="add-product-form"
             class="admin-form"
             style="display:none;">

            <h3>إضافة منتج</h3>

            <input
                type="text"
                id="product-title"
                placeholder="اسم المنتج">

            <input
                type="text"
                id="product-desc"
                placeholder="وصف المنتج">

            <input
                type="file"
                id="product-img"
                accept="image/*">

            <button id="save-product"
                    class="btn-primary">

                نشر المنتج

            </button>

        </div>

        <!-- المنتجات -->
        <div id="gallery-container"
             class="gallery-grid">

        </div>

    </section>

    <!-- نافذة تكبير الصورة -->
    <div id="imageModal">

        <img id="modalContent">

        <div id="caption">
            اضغط في أي مكان للإغلاق
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
